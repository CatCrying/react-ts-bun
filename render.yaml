services:
  - type: web
    runtime: static
    name: react-ts-bun
    repo: https://github.com/CatCrying/react-ts-bun
    branch: main
    buildCommand: bun install && bun run build
    staticPublishPath: dist
    envVars:
      - key: BUN_VERSION
        value: 1.4.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
